<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>先存飞书设置</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="options">
<main class="ps-root">
<header class="ps-header"><img class="ps-logo" src="icons/icon-128.png" alt=""><div><strong>先存飞书设置</strong><small class="ps-slogan">先进团队，先存飞书</small><small>Extension ID: <span id="extension-id"></span></small></div></header>

<section class="ps-card">
  <h2>1. 配对本地 Bridge</h2>
  <div id="bridge-ok" class="ps-bridge-ok hidden"><span class="ps-dot"></span><span id="bridge-ok-text">已配对 · Bridge 运行中</span><button id="re-pair" class="ps-bridge-re" type="button">重新配对</button></div>
  <div id="pair-form">
    <label class="ps-field"><span class="ps-label">安装器显示的配对码</span><input id="code" class="ps-input" autocomplete="off" placeholder="粘贴一次性配对码"></label>
    <button id="pair" class="ps-btn primary pair-submit" type="button">完成配对</button>
  </div>
</section>

<section class="ps-card pc-card">
  <h2>2. 预设管理</h2>
  <p class="ps-desc">每套预设自带保存目标、模板与 triggers 规则；标签顺序即规则命中优先级。至少保留一套预设。</p>
  <div class="ps-tabs" id="preset-tabs"></div>
  <div class="pc-form">
    <label class="ps-field"><span class="ps-label">名称</span><input id="f-name" class="ps-input" autocomplete="off"></label>

    <div class="ps-field"><span class="ps-label">保存目标</span>
      <button class="ps-target" id="f-target" type="button">
        <span id="f-target-icon">🗂</span><span class="ps-target-text" id="f-target-text">尚未设置</span><span class="ps-target-edit">更改 ›</span>
      </button>
    </div>
    <div id="picker-panel" class="hidden">
      <div id="picker">
        <nav id="crumbs" class="crumbs hidden"></nav>
        <div id="picker-status" class="picker-status"></div>
        <ul id="picker-list" class="picker-list"></ul>
        <button id="picker-more" class="link hidden" type="button">加载更多</button>
        <div class="picker-actions">
          <button id="picker-back" class="link hidden" type="button">返回上级</button>
          <button id="picker-retry" class="link hidden" type="button">重试</button>
          <button id="picker-save" class="ps-btn primary picker-confirm" type="button" disabled>设为该预设的保存目标</button>
        </div>
      </div>
      <details id="advanced">
        <summary>高级设置：手动输入节点 token 或空间 ID</summary>
        <p class="ps-desc">与可视化选择使用同一套 Bridge 验证语义；仅填空间 ID 时保存为该知识库根层目标。</p>
        <label class="ps-field"><span class="ps-label">Wiki 节点 token</span><input id="token" class="ps-input" placeholder="wikcn…"></label>
        <label class="ps-field"><span class="ps-label">空间 ID（节点 token 留空时作为空间目标）</span><input id="space" class="ps-input" placeholder="7…"></label>
        <button id="save-target" class="ps-btn primary pair-submit" type="button">验证并保存</button>
      </details>
    </div>

    <div class="ps-field"><span class="ps-label">图片写入模式</span>
      <div class="ps-seg" id="f-image-mode">
        <button class="ps-seg-opt" data-value="preview" type="button">预览优先</button>
        <button class="ps-seg-opt" data-value="download" type="button">下载优先</button>
        <button class="ps-seg-opt" data-value="off" type="button">不保存</button>
      </div>
      <span class="ps-desc" id="f-image-mode-hint"></span>
    </div>

    <label class="ps-field"><span class="ps-label">标题模板</span><input id="f-title" class="ps-input mono" autocomplete="off" placeholder="{{title}}"></label>
    <div class="ps-vars" data-field="f-title"></div>

    <label class="ps-field"><span class="ps-label">追加正文模板</span><textarea id="f-body" class="ps-input mono" rows="3" placeholder="留空则不追加；含 {{content}} 时正文替换占位符"></textarea></label>
    <div class="ps-vars" data-field="f-body"></div>

    <div class="ps-field"><span class="ps-label">默认动作</span>
      <div class="ps-seg" id="f-action">
        <button class="ps-seg-opt" data-value="feishu" type="button">⬇ 保存到飞书</button>
        <button class="ps-seg-opt" data-value="clipboard" type="button">⧉ 复制到剪贴板</button>
        <button class="ps-seg-opt" data-value="file" type="button">💾 保存为文件</button>
      </div>
    </div>

    <label class="ps-field"><span class="ps-label">Triggers 规则（一行一条）</span><textarea id="f-triggers" class="ps-input mono" rows="3" placeholder="https://example.com/blog&#10;/^https:\/\/.*\.zhihu\.com\//i"></textarea></label>
    <div id="trigger-errors" class="trigger-errors hidden"></div>
  </div>
</section>

<section class="ps-card">
  <h2>3. 开发者模式</h2>
  <button class="ps-switch-row" id="devmode-toggle" type="button" aria-pressed="false">
    <span class="ps-switch-text"><span class="ps-switch-label">开发者模式</span><span class="ps-switch-sub">记录并展示每次剪藏任务的耗时与日志</span></span>
    <span class="ps-switch"></span>
  </button>
  <div id="joblog" class="hidden">
    <div class="joblog-head"><span class="joblog-head-title">最近任务</span><button id="joblog-refresh" class="joblog-refresh" type="button">刷新</button></div>
    <div id="joblog-status" class="joblog-status"></div>
    <div id="joblog-list" class="joblog-list"></div>
  </div>
</section>

<div id="status" class="ps-note hidden"></div>
</main>
<div id="toast" class="ps-toast" role="status"></div>
<div id="dialog-root"></div>
<script type="module" src="options.js"></script>
</body>
</html>
