<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>飞书剪藏设置</title><link rel="stylesheet" href="ui.css"></head><body class="options"><main><header><div class="logo">飞</div><div><strong>飞书剪藏设置</strong><small>Extension ID: <span id="extension-id"></span></small></div></header>
<section class="card"><h2>1. 配对本地 Bridge</h2><label>安装器显示的配对码<input id="code" autocomplete="off" placeholder="粘贴一次性配对码"></label><button id="pair" class="primary">完成配对</button></section>
<section class="card"><h2>2. 默认保存目标</h2><p>在下方浏览你有权访问的知识库：点知识库名称将其根层选为目标，点「进入」浏览并选中具体文档节点。</p><p class="current-target">当前默认目标：<strong id="current-destination">尚未设置</strong></p>
<div id="picker"><nav id="crumbs" class="crumbs hidden"></nav><div id="picker-status" class="picker-status"></div><ul id="picker-list" class="picker-list"></ul><button id="picker-more" class="link hidden" type="button">加载更多</button><div class="picker-actions"><button id="picker-back" class="link hidden" type="button">返回上级</button><button id="picker-retry" class="link hidden" type="button">重试</button><button id="picker-save" class="primary hidden" type="button" disabled>设为默认保存目标</button></div></div>
<details id="advanced"><summary>高级设置：手动输入节点 token 或空间 ID</summary><p>与可视化选择使用同一套 Bridge 验证与保存语义；仅填空间 ID 时保存为该知识库根层目标。</p><label>Wiki 节点 token<input id="token" placeholder="wikcn…"></label><label>空间 ID（节点 token 留空时作为空间目标）<input id="space" placeholder="7…"></label><button id="save-target" class="primary">验证并保存</button></details></section><div id="status" class="status hidden"></div></main><script type="module" src="options.js"></script></body></html>
