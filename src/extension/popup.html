<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>飞书剪藏</title><link rel="stylesheet" href="ui.css"></head><body><main>
  <header><div class="logo">飞</div><div><strong>飞书剪藏</strong><small id="bridge">正在连接 Bridge…</small></div><button id="settings" class="icon" title="设置">⚙</button></header>
  <section class="card"><small>当前页面</small><h1 id="page-title">正在读取…</h1><p id="page-host"></p></section>
  <section class="card destination"><div><small id="destination-kind">默认保存目标</small><strong id="destination">尚未设置</strong></div><button id="change" class="link">仅本次更改</button></section>
  <label class="toggle-row"><span><strong>包含图片</strong><small>失败时正文仍会保存</small></span><input id="images" type="checkbox" checked></label>
  <div id="status" class="status hidden"></div><div class="spacer"></div>
  <button id="save" class="primary">保存到飞书</button><button id="open" class="primary hidden">打开飞书文档 ↗</button>
  <small class="fine">每次点击都会创建一篇新文档。关闭弹窗不会中断保存。</small>
</main><script src="popup.js"></script></body></html>
