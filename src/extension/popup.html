<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>飞书剪藏</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><main>
  <header class="hero"><div class="hero-top"><div class="logo">飞</div><strong>飞书剪藏</strong><span id="bridge" class="pill">正在连接 Bridge…</span><button id="settings" class="hero-gear" title="设置">⚙</button></div><div class="title-wrap"><input id="page-title" class="title-input" type="text" value="正在读取…" aria-label="文档标题"><button id="title-reset" class="title-reset hidden" type="button" title="重置为预设模板标题">↺</button></div><p id="page-host"></p></header>
  <div class="popup-body">
    <div id="presets" class="presets" role="group" aria-label="预设"></div>
    <section class="fold"><button id="settings-toggle" class="fold-head" type="button" aria-expanded="false"><span>⚙ 本次设置 <em>仅本次生效</em></span><span id="settings-caret" class="fold-caret">⌄</span></button><div id="settings-body" class="fold-body hidden">
      <button id="change" class="chip" type="button" title="仅本次更改，不影响默认目标"><span class="chip-icon">🗂</span><span id="destination" class="chip-text">尚未设置</span><span id="destination-temp-badge" class="chip-temp hidden">仅本次</span><span class="chip-edit">更改 ›</span></button>
      <label class="img-row"><span class="img-text"><strong>包含图片</strong><small>失败时正文仍会保存</small></span><input id="images" type="checkbox" checked><span class="switch"></span></label>
      <input id="append" class="append" type="text" placeholder="追加正文（仅本次）… 支持 {{变量}}" aria-label="追加正文（仅本次）" spellcheck="false">
    </div></section>
    <section class="fold"><button id="preview-toggle" class="fold-head" type="button" aria-expanded="false"><span>📄 预览 · <span id="preview-title"></span></span><span id="preview-caret" class="fold-caret">展开 ⌄</span></button><div id="preview-body" class="preview-scroll hidden"></div></section>
    <div id="status" class="status hidden"></div>
    <div class="cta"><button id="save" class="primary">⬇ 保存到飞书</button><button id="open" class="primary hidden">打开飞书文档 ↗</button></div>
    <small class="fine">每次点击都会创建一篇新文档。关闭弹窗不会中断保存。</small>
  </div>
  <div id="picker-panel" class="picker-overlay hidden"><div id="picker-mask" class="sheet-mask"></div><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head">选择本次剪藏目标<small>不影响默认目标</small></div><nav id="tp-crumbs" class="crumbs hidden"></nav><div id="tp-status" class="picker-status"></div><ul id="tp-list" class="picker-list"></ul><button id="tp-more" class="link hidden" type="button">加载更多</button><div class="picker-actions"><button id="tp-back" class="link hidden" type="button">返回上级</button><button id="tp-retry" class="link hidden" type="button">重试</button><span class="spacer"></span><button id="tp-cancel" class="link" type="button">取消</button></div><button id="tp-confirm" class="primary" type="button" disabled>仅本次使用该目标</button></section></div>
</main><script type="module" src="popup.js"></script></body></html>
